<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Nadia Cañadas Giménez</title>
  <link rel="stylesheet" href="/assets/style.css">

     <style>
    /* ============================================================
       Antichambre : Neon Workshop
       ============================================================ */

    /* 1. Mode sombre (PAR DÉFAUT) */
    :root,
    :root[data-theme="dark"] {
      --fond: #0d0b14;
      --fond-carte: #171324;
      --texte: #f3e8ff;
      --texte-doux: #9484b8;
      --accent: #9d5cff;
      --accent-fonce: #c084fc;
      --ligne: #2e2646;
    }

    /* 2. Mode clair (quand le visiteur bascule le bouton) */
    :root[data-theme="light"] {
      --fond: #f8f6fc;
      --fond-carte: #ffffff;
      --texte: #161224;
      --texte-doux: #6b6182;
      --accent: #7c3aed;
      --accent-fonce: #6d28d9;
      --ligne: #e5def0;
    }

    /* Halo d'ambiance en arrière-plan */
    body {
      background-color: var(--fond);
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(157, 92, 255, 0.18), transparent);
      background-repeat: no-repeat;
    }
  </style>


</head>
<body>

  <header class="site">
    <div class="interieur">
      <a class="marque" href="/antechamber/">The Antechamber</a>
      <nav aria-label="Navigation de l'Antichambre">
        <ul>
          <li><a href="{{ '/antechamber/projects/' | relative_url }}">Projects</a></li>
          <li><a href="{{ '/antechamber/notes/' | relative_url }}">Notes</a></li>
          <li><a href="{{ '/antechamber/about/' | relative_url }}">About</a></li>
          <li><a href="{{ '/' | relative_url }}" style="color: var(--accent); font-weight: 600;">← Profolio</a></li>
        </ul>
      </nav>
      <div class="controles-header">
        <button class="theme-toggle" aria-label="Changer de thème"><span class="theme-icon">🌙</span></button>
        <button class="lang-toggle" aria-label="Changer de langue">
          <span class="lang-opt lang-opt--en">EN</span>
          <span class="lang-sep">|</span>
          <span class="lang-opt lang-opt--fr">FR</span>
        </button>
      </div>
    </div>
  </header>

  {{ content }}

  <footer>
    <p>© 2026 Nadia Cañadas Giménez</p>
    <p style="margin-top: 0.5rem;">
      <a href="/" style="color: var(--texte-doux); text-decoration: none; font-size: 0.9rem;">💼</a>
    </p>
  </footer>

  <script src="{{ '/assets/lang.js' | relative_url }}"></script>
</body>
</html>
