<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Nadia Cañadas Giménez</title>
  <link rel="stylesheet" href="/assets/style.css">

     <style>
    /* ============================================================
       Antichambre : Neon Workshop & Améthyste Douce
       ============================================================ */

    /* 1. Mode sombre (PAR DÉFAUT) : Nuit d'encre & Halo Ultraviolet */
    :root,
    :root[data-theme="dark"] {
      --fond: #0d0b14;
      --fond-carte: #171324;
      --texte: #f3e8ff;
      --texte-doux: #9484b8;
      --accent: #9d5cff;
      --accent-fonce: #c084fc;
      --ligne: #2e2646;
      --halo-couleur: rgba(157, 92, 255, 0.18);
    }

    /* 2. Mode clair adouci : Albâtre poudré, Ivoire & Améthyste fumée */
    :root[data-theme="light"] {
      --fond: #f4f1f7;          /* Fond brume/lin clair très reposant */
      --fond-carte: #faf8fc;    /* Cartes en ivoire soyeux (pas de blanc agressif) */
      --texte: #231f2d;         /* Ardoise prune sombre, chaleureuse pour la lecture */
      --texte-doux: #736c82;    /* Gris lilas fumé */
      --accent: #6b46c1;        /* Améthyste feutrée, mate et chic (zéro néon criard) */
      --accent-fonce: #55349e;  /* Survol profond */
      --ligne: #e2dceb;         /* Délimitations très douces */
      --halo-couleur: rgba(107, 70, 193, 0.08); /* Halo très discret et vaporeux */
    }

    /* Halo d'ambiance adaptatif */
    body {
      background-color: var(--fond);
      background-image: radial-gradient(ellipse 80% 50% at 50% -20%, var(--halo-couleur), transparent);
      background-repeat: no-repeat;
      transition: background-color 0.25s ease;
    }
  </style>



</head>
<body>

  <header class="site">
    <div class="interieur">
      <a class="marque" href="/antechamber/">The Antechamber</a>
      <nav aria-label="Navigation de l'Antichambre">
        <ul>
          <li><a href="{{ '/antechamber/projects/' | relative_url }}">Projects</a></li>
          <li><a href="{{ '/antechamber/notes/' | relative_url }}">Notes</a></li>
          <li><a href="{{ '/antechamber/about/' | relative_url }}">About</a></li>
          <li><a href="{{ '/' | relative_url }}" style="color: var(--accent); font-weight: 600;">← Profolio</a></li>
        </ul>
      </nav>
      <div class="controles-header">
        <button class="theme-toggle" aria-label="Changer de thème"><span class="theme-icon">🌙</span></button>
        <button class="lang-toggle" aria-label="Changer de langue">
          <span class="lang-opt lang-opt--en">EN</span>
          <span class="lang-sep">|</span>
          <span class="lang-opt lang-opt--fr">FR</span>
        </button>
      </div>
    </div>
  </header>

  {{ content }}

  <footer>
    <p>© 2026 Nadia Cañadas Giménez</p>
    <p style="margin-top: 0.5rem;">
      <a href="/" style="color: var(--texte-doux); text-decoration: none; font-size: 0.9rem;">💼</a>
    </p>
  </footer>

  <script src="{{ '/assets/lang.js' | relative_url }}"></script>
</body>
</html>
