<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Nadia Cañadas Giménez</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    /* Palette violette propre à l'Antichambre */
    :root {
      --fond: #f5f0ff;
      --fond-carte: #ffffff;
      --texte: #0e0c1e;
      --texte-doux: #5e5b8a;
      --accent: #7c3aed;
      --accent-fonce: #6d28d9;
      --ligne: #ddd6fe;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --fond: #0e0c1e;
        --fond-carte: #1c1a35;
        --texte: #f0eeff;
        --texte-doux: #8b89b5;
        --accent: #a78bfa;
        --accent-fonce: #c4b5fd;
        --ligne: #2d2b50;
      }
    }
    :root[data-theme="dark"] {
      --fond: #0e0c1e;
      --fond-carte: #1c1a35;
      --texte: #f0eeff;
      --texte-doux: #8b89b5;
      --accent: #a78bfa;
      --accent-fonce: #c4b5fd;
      --ligne: #2d2b50;
    }
    :root[data-theme="light"] {
      --fond: #f5f0ff;
      --fond-carte: #ffffff;
      --texte: #0e0c1e;
      --texte-doux: #5e5b8a;
      --accent: #7c3aed;
      --accent-fonce: #6d28d9;
      --ligne: #ddd6fe;
    }
  </style>
</head>
<body>

  <header class="site">
    <div class="interieur">
      <a class="marque" href="/antechamber.html">The Antechamber</a>
      <nav aria-label="Navigation de l'Antichambre">
        <ul>
          <li><a href="{{ '/antechamber/projects/' | relative_url }}">Projects</a></li>
          <li><a href="{{ '/antechamber/notes/' | relative_url }}">Notes</a></li>
          <li><a href="{{ '/antechamber/about/' | relative_url }}">About</a></li>
          <li><a href="{{ '/' | relative_url }}" style="color: var(--accent); font-weight: 600;">← Profolio</a></li>
        </ul>
      </nav>
      <div class="controles-header">
        <button class="theme-toggle" aria-label="Changer de thème"><span class="theme-icon">🌙</span></button>
        <button class="lang-toggle" aria-label="Changer de langue">
          <span class="lang-opt lang-opt--en">EN</span>
          <span class="lang-sep">|</span>
          <span class="lang-opt lang-opt--fr">FR</span>
        </button>
      </div>
    </div>
  </header>

  {{ content }}

  <footer>
    <p>© 2026 Nadia Cañadas Giménez</p>
    <p style="margin-top: 0.5rem;">
      <a href="/" style="color: var(--texte-doux); text-decoration: none; font-size: 0.9rem;">💼</a>
    </p>
  </footer>

  <script src="/assets/lang.js"></script>
</body>
</html>
