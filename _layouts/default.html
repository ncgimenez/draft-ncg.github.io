<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | Nadia Cañadas Giménez</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

  <header class="site">
    <div class="interieur">
      <a class="marque" href="/">NCG</a>
      <nav aria-label="Main navigation">
        <ul>
          <li><a href="/" data-i18n="nav.home">Home</a></li>
          <li><a href="/projects/" data-i18n="nav.projects">Projects</a></li>
          <li><a href="/blog/" data-i18n="nav.notes">Notes</a></li>
          <li><a href="/about.html" data-i18n="nav.about">About</a></li>
        </ul>
      </nav>
      <div class="controles-header">
        <button class="theme-toggle" aria-label="Switch theme"><span class="theme-icon">🌙</span></button>
        <button class="lang-toggle" aria-label="Switch language">
          <span class="lang-opt lang-opt--en">EN</span>
          <span class="lang-sep">|</span>
          <span class="lang-opt lang-opt--fr">FR</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Le contenu spécifique de chaque page viendra s'insérer ici automatiquement -->
  {{ content }}


  <footer>
    <p>© 2026 Nadia Cañadas Giménez ·
      <a href="https://www.linkedin.com/in/ncgimenez" data-i18n="footer.linkedin">LinkedIn</a>
      · <a href="mailto:ncgimenez@proton.me">ncgimenez@proton.me</a>
    </p>
    {% if page.title == "About" %}
    <p style="margin-top: 0.75rem; text-align: center;">
      <a class="cle-secrete" href="{{ '/antechamber/' | relative_url }}" title="Enter the antechamber" aria-label="Enter the antechamber">🗝</a>
   </p>
    {% endif %}
  </footer>

  <!------- Scripts ------->
  
  <script src="/assets/lang.js"></script>

  ...
  <script src="/assets/lang.js"></script>

  {% if page.mermaid %}
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: 'base',
      themeVariables: {
        primaryColor: '#ffffff',
        primaryTextColor: '#1f2430',
        primaryBorderColor: '#e6dfd3',
        lineColor: '#5b6272',
        background: '#faf7f2',
        fontSize: '13px'
      }
    });
  </script>
  {% endif %}
  
</body>
</html>
